[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmkit"
version = "0.1.0"
description = "SAMA signature detection from Swarm magnetic field data"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
authors = [
    {name = "Natanael A. N. Junior", email = "natanaelanjr@gmail.com"}
]
keywords = [
    "space weather",
    "South Atlantic Magnetic Anomaly",
    "Swarm satellites",
    "geomagnetic storms",
    "machine learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "viresclient>=0.11",
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1"]

[project.scripts]
swarmkit = "swarmkit.cli:main"

[project.urls]
Homepage = "https://github.com/Nat699/swarmkit"
Repository = "https://github.com/Nat699/swarmkit"
Issues = "https://github.com/Nat699/swarmkit/issues"

[tool.hatch.build.targets.wheel]
packages = ["swarmkit"]
